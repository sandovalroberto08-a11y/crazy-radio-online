
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRAZY RADIO ONLINE | Transmitiendo emociones</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  font-family: Arial, sans-serif;
}

.web-radio {
  position: relative;
  width: 100%;
  max-width: 1024px;
  margin: auto;
  line-height: 0;
}

.web-radio img {
  width: 100%;
  height: auto;
  display: block;
}

.play-button {
  position: absolute;
  left: 8.5%;
  top: 40.5%;
  width: 17%;
  height: 10%;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.whatsapp-button {
  position: absolute;
  left: 7%;
  top: 77.5%;
  width: 87%;
  height: 7.5%;
  background: transparent;
  border: 0;
  cursor: pointer;
}

.social-tiktok {
  position: absolute;
  left: 32%;
  top: 89.5%;
  width: 8%;
  height: 5%;
}

.social-instagram {
  position: absolute;
  left: 42%;
  top: 89.5%;
  width: 8%;
  height: 5%;
}

.social-facebook {
  position: absolute;
  left: 52%;
  top: 89.5%;
  width: 8%;
  height: 5%;
}

.social-youtube {
  position: absolute;
  left: 62%;
  top: 89.5%;
  width: 8%;
  height: 5%;
}

#radio-status {
  position: fixed;
  bottom: 10px;
  left: 10px;
  background: #111;
  color: #ffd400;
  padding: 8px 12px;
  border: 1px solid #ffd400;
  border-radius: 8px;
  font-size: 13px;
  line-height: normal;
  display: none;
  z-index: 100;
}
</style>
</head>

<body>

<div class="web-radio">

  <img src="crazy-radio-online-diseno.jpeg"
       alt="CRAZY RADIO ONLINE - Transmitiendo emociones">

  <button class="play-button"
          onclick="toggleRadio()"
          aria-label="Reproducir o pausar la radio">
  </button>

  <a class="whatsapp-button"
     href="https://wa.me/34640845500"
     target="_blank"
     aria-label="Enviar nota de audio por WhatsApp">
  </a>

  <a class="social-tiktok"
     href="https://www.tiktok.com/"
     target="_blank"
     aria-label="TikTok">
  </a>

  <a class="social-instagram"
     href="https://www.instagram.com/"
     target="_blank"
     aria-label="Instagram">
  </a>

  <a class="social-facebook"
     href="https://www.facebook.com/"
     target="_blank"
     aria-label="Facebook">
  </a>

  <a class="social-youtube"
     href="https://www.youtube.com/"
     target="_blank"
     aria-label="YouTube">
  </a>

</div>

<div id="radio-status">CRAZY RADIO ONLINE</div>

<audio id="radio-player"
       preload="none"
      src="https://crazyradio.radio12345.com/stream">
</audio>

<script>
const player = document.getElementById("radio-player");
const statusBox = document.getElementById("radio-status");

function toggleRadio() {
  if (player.paused) {
    statusBox.style.display = "block";
    statusBox.textContent = "Conectando con CRAZY RADIO ONLINE...";

    player.play()
      .then(() => {
        statusBox.textContent = "🔴 CRAZY RADIO ONLINE EN DIRECTO";
      })
      .catch(() => {
        statusBox.textContent = "Revisa la dirección de emisión de la radio.";
      });
  } else {
    player.pause();
    statusBox.textContent = "Radio pausada";
  }
}
</script>

</body>
</html>
