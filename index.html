<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Crazy Radio">
<link rel="manifest" href="manifest.webmanifest">
<title>Crazy Radio Online</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}
main{max-width:650px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.art{width:100%;height:auto;display:block}
.player{width:100%;padding:18px 20px 28px;text-align:center;background:#050505}
button{background:#ffd400;color:#050505;border:0;border-radius:40px;padding:16px 34px;font-size:18px;font-weight:800;cursor:pointer}
#status{margin-top:12px;color:#ffd400;font-size:14px;min-height:20px}
input{width:min(260px,80%);accent-color:#ffd400;margin-top:14px}
</style>
</head>
<body>
<main>
<img class="art" src="crazy-radio-design.jpg" alt="Crazy Radio Online — Transmitiendo emociones">
<section class="player">
<button id="play" type="button">▶ ESCUCHAR EN DIRECTO</button>
<div id="status" role="status">Pulsa PLAY para escuchar la emisora</div>
<label for="volume">VOLUMEN</label><br>
<input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
<audio id="audio" preload="none" src="<audio id="radio-audio" preload="none"
src="https://uk15freenew.listen2myradio.com/live.mp3?typeportmount=s1_35214_stream_327418962">
</audio>"></audio>
</section>
</main>
<script>
const audio=document.getElementById('audio'), play=document.getElementById('play'), status=document.getElementById('status'), volume=document.getElementById('volume');
audio.volume=Number(volume.value);
volume.addEventListener('input',()=>audio.volume=Number(volume.value));
play.addEventListener('click',async()=>{
 if(!audio.paused){audio.pause();play.textContent='▶ ESCUCHAR EN DIRECTO';status.textContent='Radio pausada';return}
 status.textContent='Conectando con Crazy Radio Online…';
 try{await audio.play();play.textContent='❚❚ PAUSAR RADIO';status.textContent='🔴 CRAZY RADIO ONLINE EN DIRECTO'}
 catch(e){status.textContent='No se pudo conectar el stream. Revisa la dirección de audio.'}
});
audio.addEventListener('playing',()=>status.textContent='🔴 CRAZY RADIO ONLINE EN DIRECTO');
audio.addEventListener('error',()=>status.textContent='No responde el enlace de audio. Necesitamos verificar el stream.');
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
